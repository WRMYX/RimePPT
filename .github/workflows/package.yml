name: Package application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run ink tests
        run: dotnet run --project tests/RimePPT.Ink.Tests -c Release
      - name: Build portable archive
        run: ./tools/Build-Portable.ps1 -OutputDirectory artifacts/Portable
      - name: Build signed MSIX and public certificate
        run: ./tools/Build-MSIX.ps1 -OutputDirectory artifacts/MSIX
      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: RimePPT-Portable-x64
          path: artifacts/Portable/*.zip
          if-no-files-found: error
      - name: Upload MSIX and public certificate
        uses: actions/upload-artifact@v4
        with:
          name: RimePPT-MSIX-with-certificate-x64
          path: |
            artifacts/MSIX/*.msix
            artifacts/MSIX/*.cer
          if-no-files-found: error
