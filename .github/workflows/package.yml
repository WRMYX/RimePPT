name: Package application / 打包程序

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: '草稿发布版本，例如 v1.2.3；留空则仅打包'
        required: false
        type: string

concurrency:
  group: package-${{ inputs.release_version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package / 打包
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out code / 获取源代码
        uses: actions/checkout@v6
      - name: Set up .NET / 配置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve package version / 确定安装包版本
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          $tag = ''
          if ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            $tag = $env:REQUESTED_VERSION.Trim()
          }
          if ($tag) {
            if ($tag -notmatch '^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3.'
            }
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            [xml]$manifest = Get-Content RimePPT/Package.appxmanifest -Raw
            $version = [string]$manifest.Package.Identity.Version
          }
          $parsed = [version]$version
          if ($parsed.Major -lt 1 -or $parsed.Major -gt 65535 -or $parsed.Minor -gt 65535 -or $parsed.Build -gt 65535 -or $parsed.Revision -ne 0) {
            throw 'MSIX version components must be 0..65535, major must be nonzero and revision must be zero.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Reject existing manual release tag / 检查版本标签是否重复
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existing = git ls-remote --exit-code origin "refs/tags/$env:RELEASE_TAG"
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw 'This version tag already exists. Choose a new version.' }
          if ($code -ne 2) { throw 'Unable to check remote version tags.' }
          $global:LASTEXITCODE = 0
      - name: Run ink tests / 运行笔迹测试
        run: dotnet run --project tests/RimePPT.Ink.Tests -c Release
      - name: Build portable archive / 生成便携版
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/Build-Portable.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/Portable
      - name: Build signed MSIX and public certificate / 生成签名 MSIX 与证书
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/Build-MSIX.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/MSIX
      - name: Build Store package / 生成 Store 提交包
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./tools/Build-MSIX.ps1 -Store -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/Store
      - name: Prepare release archives / 整理发布压缩包
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory artifacts/Release -Force | Out-Null
          $portable = @(Get-ChildItem artifacts/Portable -Filter '*.zip')
          if ($portable.Count -ne 1) { throw 'Expected exactly one portable archive.' }
          Copy-Item -LiteralPath $portable[0].FullName -Destination "artifacts/Release/RimePPT-$env:PACKAGE_VERSION-Portable-x64.zip"
          if (@(Get-ChildItem artifacts/MSIX -Filter '*.msix').Count -ne 1 -or @(Get-ChildItem artifacts/MSIX -Filter '*.cer').Count -ne 1) {
            throw 'Expected one signed MSIX and one public certificate.'
          }
          Compress-Archive -Path artifacts/MSIX/*.msix, artifacts/MSIX/*.cer -DestinationPath "artifacts/Release/RimePPT-$env:PACKAGE_VERSION-MSIX-with-certificate-x64.zip"
          $store = @(Get-ChildItem artifacts/Store -Filter '*.msix')
          if ($store.Count -ne 1) { throw 'Expected exactly one Store package.' }
      - name: Upload portable archive / 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: RimePPT-Portable-x64
          path: artifacts/Release/*-Portable-x64.zip
          if-no-files-found: error
      - name: Upload MSIX and public certificate / 上传 MSIX 与证书
        uses: actions/upload-artifact@v4
        with:
          name: RimePPT-MSIX-with-certificate-x64
          path: artifacts/Release/*-MSIX-with-certificate-x64.zip
          if-no-files-found: error
      - name: Upload Store package / 上传 Store 提交包
        uses: actions/upload-artifact@v4
        with:
          name: RimePPT-Store-x64
          path: artifacts/Store/*.msix
          if-no-files-found: error
      - name: Create draft release / 创建草稿发布
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $archives = @(Get-ChildItem artifacts/Release -Filter '*.zip' -File | ForEach-Object { $_.FullName })
          $options = @('--draft', '--title', "RimePPT $env:RELEASE_TAG", '--generate-notes')
          if ($env:EVENT_NAME -eq 'push') {
            $options += '--verify-tag'
          } else {
            $options += @('--target', $env:RELEASE_COMMIT)
          }
          gh release create $env:RELEASE_TAG @archives @options
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
