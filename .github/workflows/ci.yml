name: Build and test / 编译与测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check / 检查
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out code / 获取源代码
        uses: actions/checkout@v6
      - name: Set up .NET / 配置 .NET 环境
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run ink tests / 运行笔迹测试
        run: dotnet run --project tests/RimePPT.Ink.Tests -c Release
      - name: Verify portable update rollback / 验证便携更新与回滚
        run: ./tests/RimePPT.Update.Tests/Test-PortableUpdate.ps1
      - name: Build application / 编译程序
        run: dotnet build RimePPT/RimePPT.csproj -c Release -p:Platform=x64 -p:PublishTrimmed=false
      - name: Build Office add-in / 编译 Office 加载项
        run: ./tools/Build-OfficeAddin.ps1
      - name: Verify Office bridge contract / 验证 Office 桥接接口
        run: powershell -NoProfile -File ./tools/Test-OfficeAddin.ps1
